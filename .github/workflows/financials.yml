# Collects each listed company's reported figures from Moneycontrol in small,
# resumable low-rate batches. Progress is kept in the Actions cache (so the site
# is not redeployed every run); when every company is done, the figures are
# committed once to public/data/financials/. Stops on any 403/429, no bypass.
name: Collect reported financials

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: financials
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache/restore@v4
        with:
          path: fin-state
          key: fin-none
          restore-keys: fin-
      - run: python3 scripts/financials_batch.py 270
      - name: Save progress
        run: echo "KEY=fin-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        with:
          path: fin-state
          key: ${{ env.KEY }}
      - name: Drop older progress caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key fin- --limit 100 --json key --jq '.[].key' | grep -v "^$KEY$" | while read k; do gh cache delete "$k" || true; done
      - name: Decide checkpoint
        id: cp
        run: |
          if [ $(( ${{ github.run_number }} % 12 )) -eq 0 ]; then echo "do=true" >> "$GITHUB_OUTPUT"; fi
      - name: Hourly recoverable checkpoint (artifact, 30 days)
        if: steps.cp.outputs.do == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: financials-checkpoint
          path: fin-state/financials.jsonl
          retention-days: 30
          overwrite: true
      - name: Publish figures (partial about every 3h, final when complete)
        run: |
          read done total < fin-state/progress.txt
          complete=false; [ "$done" -ge "$total" ] && complete=true
          already=false; grep -q '"complete": true' public/data/financials/progress.json 2>/dev/null && already=true
          if { [ "$complete" = true ] && [ "$already" = false ]; } || { [ "$done" -ge 150 ] && ! grep -q '"v": 2' public/data/financials/progress.json 2>/dev/null; } || [ $(( ${{ github.run_number }} % 36 )) -eq 0 ]; then
            python3 scripts/financials_batch.py publish
            git config user.name "fistotex-bot"
            git config user.email "bot@fistotex.com"
            git add public/data/financials
            git diff --cached --quiet && exit 0
            git commit -m "data: reported financial figures ($done of $total companies collected)"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
          fi
      - name: Continue (bounded self-dispatch)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only when this run made progress and the source has not stopped us
          # (no fin-state/BLOCKED). Same request rate; no progress or a stop means no follow-up run.
          if [ -f fin-state/CONTINUE ] && [ ! -f fin-state/BLOCKED ]; then
            gh workflow run financials.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
